name: Build and Pin to IPFS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_pin:
    runs-on: ubuntu-latest
    name: Build and Pin to IPFS
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      # Pinned and PUBLISHED on our OWN node (pinnace), not a paid pinning
      # service. Generated by `pnpm pinnace install-ci --system github --emit
      # steps --endpoint https://ipfs-publisher.ska.sh --site ronan.eth
      # --output-dir web/build --set-mode ipns`.
      #
      # Unlike mandalas, this deploys STRAIGHT to the live id, and that is
      # correct: ronan.eth is an `ipns` site, so ENS points at ipns://<key> once
      # and the same deploy re-signs that record onto the new cid. The site
      # wrapper on the node therefore still means "the cid this name resolves
      # to" the moment the deploy finishes. There is nothing to promote and no
      # ENS record to move: a push IS the publish.
      #
      # No PINNACE_MASTER here on purpose. The publisher already holds the key
      # for this site, so it re-signs with no key material in CI at all (that is
      # what `pinnace authorize` bought us). The only secret is the node's
      # bearer token.
      #
      # Only on a real push: a PR build must not move a name the world resolves.
      # PRs still build above, which is what they are checked for.
      - name: Deploy to IPFS
        id: deploy
        if: github.event_name != 'pull_request'
        uses: wighawag/pinnace/actions/deploy@main
        with:
          endpoint: https://ipfs-publisher.ska.sh
          site: ronan.eth
          mode: ipns
          dir: web/build
        env:
          PINNACE_HOST_PUBLISHER_TOKEN: ${{ secrets.PINNACE_HOST_PUBLISHER_TOKEN }}
